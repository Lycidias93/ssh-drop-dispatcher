name: prepare-v4.14.1-hotfix

on:
  push:
    branches:
      - repo-maintenance/sdd-v4.14.1-ssh-import-hotfix-20260823
    paths:
      - tools/prepare_v4141_hotfix.py
      - .github/workflows/prepare-v4.14.1-hotfix.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repo-maintenance/sdd-v4.14.1-ssh-import-hotfix-20260823
          fetch-depth: 0

      - name: Generate stable hotfix source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare_v4141_hotfix.py | tee /tmp/v4141-prepare.log
          grep -Fq 'RESULT: SDD_V4141_HOTFIX_PREPARE_DONE outcome=success workflow_exit_code=0' /tmp/v4141-prepare.log
          sh -n source/stable-v4.14.1/service.sh
          ! grep -Fq '&& $CP_BIN -f "$BUNDLE_DIR/ssh/$x" "$SSH_DIR/$x"' source/stable-v4.14.1/service.sh
          grep -Fq 'bundle_ssh_atomic_refresh_failed' source/stable-v4.14.1/service.sh
          grep -Fq '$MV_BIN -f "$tmp" "$SSH_DIR/$x"' source/stable-v4.14.1/service.sh

      - name: Commit generated source overlay
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- source/stable-v4.14.1/service.sh CHANGELOG.md; then
            echo 'generated_hotfix=already_current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- source/stable-v4.14.1/service.sh CHANGELOG.md
          git commit -m 'hotfix: generate v4.14.1 atomic SSH import source'
          git push origin HEAD:repo-maintenance/sdd-v4.14.1-ssh-import-hotfix-20260823
