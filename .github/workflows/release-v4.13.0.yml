name: release-v4.13.0-legacy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}

      - name: Check frozen v4.13 release inputs
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'version=4.13.0' source/magisk/module.prop
          grep -Fxq 'versionCode=4130007' source/magisk/module.prop
          grep -Fxq 'version=4.13.0' source/stable-v4.13.0/module.prop
          grep -Fxq 'versionCode=4130007' source/stable-v4.13.0/module.prop
          grep -Fxq 'template_commit=81678604122636ad87a0f6d48eac1262a67154a4' webui-core.lock
          grep -Fxq 'core_version=0.3.0' webui-core.lock
          test -s RELEASE_NOTES_V4.13.0.md

      - name: Check whether legacy release exists
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v4.13.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'exists=yes' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=no' >> "$GITHUB_OUTPUT"
          fi

      - name: Build exact legacy stable promotion
        if: steps.existing.outputs.exists == 'no'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sdd-release-v4130
          module_zip=/tmp/sdd-release-v4130/ssh-drop-dispatcher-magisk-v4.13.0.zip
          python3 tools/build_v4130_stable.py --output "$module_zip" | tee /tmp/v4130-release-build.log
          grep -Fq 'RESULT: SDD_V4130_STABLE_BUILD_DONE outcome=success workflow_exit_code=0' /tmp/v4130-release-build.log
          grep -Fq 'stable_equivalence=only_module_prop_diff' /tmp/v4130-release-build.log
          grep -Fq 'accepted_rc6_sha256=31ed930fc222d7879e12c8f3f83516b6e4793ae995991121dfb39b8610dccdae' /tmp/v4130-release-build.log
          unzip -tq "$module_zip" >/dev/null
          unzip -p "$module_zip" module.prop | grep -Fxq 'version=4.13.0'
          unzip -p "$module_zip" module.prop | grep -Fxq 'versionCode=4130007'
          sha256sum "$module_zip" | sed 's#/tmp/sdd-release-v4130/##' > /tmp/sdd-release-v4130/SHA256SUMS

      - name: Publish missing legacy release
        if: steps.existing.outputs.exists == 'no'
        shell: bash
        run: |
          set -euo pipefail
          gh release create v4.13.0 \
            /tmp/sdd-release-v4130/ssh-drop-dispatcher-magisk-v4.13.0.zip \
            /tmp/sdd-release-v4130/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$HEAD_SHA" \
            --title 'SSH Drop Dispatcher v4.13.0' \
            --notes-file RELEASE_NOTES_V4.13.0.md \
            --latest=false

      - name: Sync legacy public release notes
        if: steps.existing.outputs.exists == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          current_body="$(gh release view v4.13.0 --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          expected_body="$(cat RELEASE_NOTES_V4.13.0.md)"
          if [ "$current_body" = "$expected_body" ]; then
            echo 'release_notes_sync=already_current'
          else
            gh release edit v4.13.0 --repo "$GITHUB_REPOSITORY" --notes-file RELEASE_NOTES_V4.13.0.md
            echo 'release_notes_sync=updated'
          fi

      - name: Verify legacy published release
        shell: bash
        run: |
          set -euo pipefail
          release_json=$(gh release view v4.13.0 --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets,body)
          RELEASE_JSON="$release_json" python3 -c "import json,os,pathlib; d=json.loads(os.environ['RELEASE_JSON']); assert d['tagName']=='v4.13.0'; assert d['isDraft'] is False; assert d['isPrerelease'] is False; names={a['name'] for a in d['assets']}; assert {'ssh-drop-dispatcher-magisk-v4.13.0.zip','SHA256SUMS'} <= names; assert d['body'].strip()==pathlib.Path('RELEASE_NOTES_V4.13.0.md').read_text().strip()"
          echo 'RESULT: SDD_V4130_LEGACY_RELEASE_DONE outcome=success workflow_exit_code=0'
