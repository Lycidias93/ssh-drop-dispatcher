name: stable-v4.14.0

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-v4.14.0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Build deterministic stable promotion
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/build_v4140_stable.py tools/build_vnext_return_rc4.py
          mkdir -p /tmp/sdd-v4140-stable
          zip=/tmp/sdd-v4140-stable/ssh-drop-dispatcher-magisk-v4.14.0.zip
          python3 tools/build_v4140_stable.py --output "$zip" | tee /tmp/v4140-stable-build.log
          grep -Fq 'RESULT: SDD_V4140_STABLE_BUILD_DONE outcome=success workflow_exit_code=0' /tmp/v4140-stable-build.log
          grep -Fq 'accepted_rc4_sha256=a0a82185dff60183dd95bbae01299a9a637836b008ede3a8f3a9da2f51e1b96d' /tmp/v4140-stable-build.log
          grep -Fq 'stable_equivalence=only_module_prop_diff' /tmp/v4140-stable-build.log
          unzip -tq "$zip" >/dev/null
          unzip -p "$zip" module.prop | grep -Fxq 'version=4.14.0'
          unzip -p "$zip" module.prop | grep -Fxq 'versionCode=4140005'
          ! unzip -p "$zip" module.prop | grep -Eq 'return-rc|verify-owner'
          unzip -Z1 "$zip" | grep -Fxq 'bin/sdd-return-helper-arm64'
          unzip -Z1 "$zip" | grep -Fxq 'tools/sdd-return.sh'
          unzip -Z1 "$zip" | grep -Fxq 'webroot/observability.js'
          unzip -p "$zip" webroot/observability.js | grep -Fq 'const CORE_VERSION = "0.6.0"'
          unzip -p "$zip" service.sh | grep -Fq 'scan_file_once(){'
          unzip -p "$zip" service.sh | grep -Fq 'EVENT_FOLLOWUP_WORKER_LOCKDIR=$STATE_DIR/event-followup.worker'
          unzip -p "$zip" tools/sdd-workflow.sh | grep -Fq 'named_file true'
          unzip -p "$zip" tools/sdd.sh | grep -Fq 'if [ "$cmd" = return ]'
          sha256sum "$zip" | sed 's#/tmp/sdd-v4140-stable/##' > /tmp/sdd-v4140-stable/SHA256SUMS

      - name: Verify stable public metadata source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'version=4.14.0' source/stable-v4.14.0/module.prop
          grep -Fxq 'versionCode=4140005' source/stable-v4.14.0/module.prop
          grep -Fq 'Return Channel v1' source/stable-v4.14.0/module.prop
          test -s RELEASE_NOTES_V4.14.0.md
          test -s README.md
          grep -Fq 'v4.14.0' README.md
          grep -Fq '## v4.14.0 - 2026-08-20' CHANGELOG.md

      - name: Public repository safety guard
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE '192\.168\.178\.|fd00::|/home/codex|BEGIN OPENSSH PRIVATE KEY|NTFY_TOKEN=' source/stable-v4.14.0 RELEASE_NOTES_V4.14.0.md README.md docs/RETURN_CHANNEL_V1_STABLE.md

      - uses: actions/upload-artifact@v4
        with:
          name: ssh-drop-dispatcher-v4.14.0-stable-candidate
          path: /tmp/sdd-v4140-stable/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
