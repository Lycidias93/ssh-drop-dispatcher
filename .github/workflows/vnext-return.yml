name: vnext-return

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vnext-return-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-return:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Verify Return Channel fixtures
        run: bash tests/verify_return_channel_v1.sh
      - name: Build reproducible Return RC2 candidate
        run: |
          set -euo pipefail
          python3 -m py_compile tools/build_vnext_return_rc2.py
          mkdir -p /tmp/sdd-return-rc2
          zip=/tmp/sdd-return-rc2/ssh-drop-dispatcher-magisk-v4.14.0-return-rc2.zip
          python3 tools/build_vnext_return_rc2.py --output "$zip" | tee /tmp/sdd-return-build.log
          grep -Fq 'RESULT: SDD_VNEXT_RETURN_RC2_BUILD_DONE outcome=success workflow_exit_code=0' /tmp/sdd-return-build.log
          grep -Fq 'webui_core_version=0.5.0' /tmp/sdd-return-build.log
          grep -Fq 'webui_core_commit=a365fea5049a1daa6e674eab27f81b0ebf4c878a' /tmp/sdd-return-build.log
          grep -Fq 'delivery_core_changed=yes_additive_return_binding_only' /tmp/sdd-return-build.log
          unzip -tq "$zip" >/dev/null
          unzip -p "$zip" module.prop | grep -Fxq 'version=4.14.0-return-rc2'
          unzip -p "$zip" module.prop | grep -Fxq 'versionCode=4140002'
          unzip -Z1 "$zip" | grep -Fxq 'bin/sdd-return-helper-arm64'
          unzip -Z1 "$zip" | grep -Fxq 'tools/sdd-return.sh'
          unzip -Z1 "$zip" | grep -Fxq 'webroot/v04.js'
          unzip -Z1 "$zip" | grep -Fxq 'webroot/race-guard.js'
          unzip -Z1 "$zip" | grep -Fxq 'webroot/observability.js'
          unzip -Z1 "$zip" | grep -Fxq 'webroot/observability.css'
          unzip -p "$zip" webroot/index.html | grep -Fq 'observability.js'
          unzip -p "$zip" webroot/index.html | grep -Fq 'observability.css'
          unzip -p "$zip" webroot/observability.js | grep -Fq 'const CORE_VERSION = "0.5.0"'
          unzip -p "$zip" service.sh | grep -Fq 'SDD_DELIVERY_BINDING_V1'
          unzip -p "$zip" service.sh | grep -Fq 'delivery_state=unchanged'
          unzip -p "$zip" tools/sdd.sh | grep -Fq 'if [ "$cmd" = return ]'
          unzip -p "$zip" bin/module-control | grep -Fq 'root-module-webui.extensions.v2'
          unzip -p "$zip" bin/module-control-base | grep -Fq '"name":"returns"'
          sha=$(sha256sum "$zip" | awk '{print $1}')
          bytes=$(wc -c < "$zip" | tr -d ' ')
          printf 'schema=sdd-vnext-return-rc2-build-manifest-v1\nversion=4.14.0-return-rc2\nversionCode=4140002\nwebui_core_version=0.5.0\nwebui_core_commit=a365fea5049a1daa6e674eab27f81b0ebf4c878a\nmodule_bytes=%s\nmodule_sha256=%s\nhost_autoexecution_added=no\narbitrary_remote_command_added=no\n' "$bytes" "$sha" > /tmp/sdd-return-rc2/build-manifest.txt
      - name: Verify stable lane remains untouched
        run: |
          set -euo pipefail
          grep -Fxq 'version=4.13.0' source/magisk/module.prop
          grep -Fxq 'versionCode=4130007' source/magisk/module.prop
          grep -Fxq 'template_commit=81678604122636ad87a0f6d48eac1262a67154a4' webui-core.lock
          grep -Fxq 'core_version=0.3.0' webui-core.lock
          python3 -m json.tool update.json >/dev/null
          grep -Fxq 'template_commit=a365fea5049a1daa6e674eab27f81b0ebf4c878a' webui-core-vnext-return.lock
          grep -Fxq 'core_version=0.5.0' webui-core-vnext-return.lock
      - name: Public repository safety guard
        run: |
          set -euo pipefail
          ! grep -RInE '192\.168\.178\.|fd00::|/home/codex|BEGIN OPENSSH PRIVATE KEY|NTFY_TOKEN=' source/vnext-return tools/build_vnext_return.py tools/build_vnext_return_rc2.py tests/verify_return_channel_v1.sh webui-core-vnext-return.lock
          ! grep -RInE 'Codex|Crosswork|ChatGPT.*task|lane=' source/vnext-return
      - uses: actions/upload-artifact@v4
        with:
          name: ssh-drop-dispatcher-v4.14.0-return-rc2-candidate
          path: /tmp/sdd-return-rc2/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
