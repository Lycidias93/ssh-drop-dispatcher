name: vnext-return-pr-integrate-v2

on:
  pull_request:

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'feature/return-channel-v1-phase1-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Apply bounded contract patch
        run: |
          python3 tools/vnext_return_pr_patch.py
          gofmt -w source/vnext-return/sdd-return-helper.go source/vnext-return/sdd-return-helper_test.go
      - name: Run full Return fixtures
        run: bash tests/verify_return_channel_v1.sh
      - name: Build candidate
        run: python3 tools/build_vnext_return.py --output /tmp/ssh-drop-dispatcher-magisk-v4.14.0-return-rc1.zip
      - name: Commit verified result and remove one-shot transports
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/vnext-return-pr-integrate.yml .github/workflows/vnext-return-pr-integrate-v2.yml tools/vnext_return_pr_patch.py
          git add -A
          git commit -m 'feat(return): close replay and delivery correlation gates'
          git push origin HEAD:"$HEAD_REF"
