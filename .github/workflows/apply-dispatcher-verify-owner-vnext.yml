name: Apply dispatcher verify-owner vNext

on:
  push:
    branches:
      - dispatcher-verify-owner-vnext-20260804
    paths:
      - scripts/apply_dispatcher_verify_owner_vnext.py
      - .github/workflows/apply-dispatcher-verify-owner-vnext.yml

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out task branch
        uses: actions/checkout@v4
        with:
          ref: dispatcher-verify-owner-vnext-20260804
          fetch-depth: 0

      - name: Apply deterministic transform
        run: |
          mkdir -p docs/generated
          python3 scripts/apply_dispatcher_verify_owner_vnext.py | tee docs/generated/dispatcher_verify_owner_vnext_fixture.txt

      - name: Verify candidate archive
        run: |
          unzip -t dist/ssh-drop-dispatcher-magisk-v4.13.0-verify-owner-rc1.zip
          grep -Fx 'RESULT: SDD_VNEXT_DISPATCHER_VERIFY_OWNER_FIXTURES_PASS version=4.13.0-verify-owner-rc1' docs/generated/dispatcher_verify_owner_vnext_fixture.txt
          grep -F 'verify_owner=dispatcher' source/magisk/service.sh
          grep -F 'external_verify_wrapper=no' source/magisk/service.sh
          grep -F 'remote_sha_match=yes' source/magisk/service.sh
          ! grep -F 'target_verify(){' source/magisk/service.sh
          ! grep -F 'else sh -n' source/magisk/service.sh

      - name: Commit generated candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source/magisk/service.sh source/magisk/module.prop source/magisk/customize.sh source/magisk/tools/pidd-config.sh dist/ docs/generated/
          git diff --cached --quiet && { echo 'No generated changes'; exit 1; }
          git commit -m 'Implement dispatcher-owned remote verification vNext'
          git push origin HEAD:dispatcher-verify-owner-vnext-20260804
