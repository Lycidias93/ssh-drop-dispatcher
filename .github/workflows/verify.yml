name: verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            first="$(head -n 1 "$file")"
            case "$first" in
              *bash*) bash -n "$file" ;;
              *) sh -n "$file" ;;
            esac
          done < <(find source/magisk tests -type f -name '*.sh' -print0)

      - name: Verify dispatcher identity fixtures
        shell: bash
        run: |
          set -euo pipefail
          bash tests/sdd-vnext-m1-identity-fixtures.sh

      - name: Verify module metadata
        shell: bash
        run: |
          set -euo pipefail
          test -s source/magisk/module.prop
          grep -Eq '^id=[A-Za-z0-9._-]+$' source/magisk/module.prop
          grep -Eq '^version=.+$' source/magisk/module.prop
          grep -Eq '^versionCode=[0-9]+$' source/magisk/module.prop
          python3 -m json.tool update.json >/dev/null
          python3 -m json.tool update-rc.json >/dev/null

      - name: Verify tracked release archives
        shell: bash
        run: |
          set -euo pipefail
          command -v unzip >/dev/null
          found=0
          while IFS= read -r -d '' archive; do
            found=1
            unzip -tqq "$archive"
          done < <(find dist -maxdepth 1 -type f -name '*.zip' -print0)
          test "$found" -eq 1

      - name: Verify clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
