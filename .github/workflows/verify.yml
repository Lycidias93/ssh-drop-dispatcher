name: verify

on:
  push:
    branches:
      - main
      - rc4-webui-overhaul
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            first="$(head -n 1 "$file")"
            case "$first" in
              *bash*) bash -n "$file" ;;
              *) sh -n "$file" ;;
            esac
          done < <(find source/magisk source/rc4-webui tests -type f \( -name '*.sh' -o -name 'module-control' \) -print0)

      - name: Verify dispatcher identity fixtures
        shell: bash
        run: |
          set -euo pipefail
          bash tests/sdd-vnext-m1-identity-fixtures.sh

      - name: Verify RC3 workflow contract
        shell: bash
        run: |
          set -euo pipefail
          bash tests/verify_rc3_workflow_contract.sh

      - name: Build RC4 secure standalone WebUI candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_rc4_webui.py --output /tmp/ssh-drop-dispatcher-magisk-v4.13.0-verify-owner-rc4.zip | tee /tmp/rc4-build.log
          grep -Fq 'RESULT: SDD_RC4_WEBUI_BUILD_DONE outcome=success delivery_core_changed=no workflow_exit_code=0' /tmp/rc4-build.log
          unzip -tq /tmp/ssh-drop-dispatcher-magisk-v4.13.0-verify-owner-rc4.zip >/dev/null
          unzip -p /tmp/ssh-drop-dispatcher-magisk-v4.13.0-verify-owner-rc4.zip module.prop | grep -Fxq 'version=4.13.0-verify-owner-rc4'
          unzip -p /tmp/ssh-drop-dispatcher-magisk-v4.13.0-verify-owner-rc4.zip module.prop | grep -Fxq 'versionCode=4130004'
          unzip -Z1 /tmp/ssh-drop-dispatcher-magisk-v4.13.0-verify-owner-rc4.zip | grep -Fxq 'bin/webui-server-arm64'
          unzip -Z1 /tmp/ssh-drop-dispatcher-magisk-v4.13.0-verify-owner-rc4.zip | grep -Fxq 'bin/module-control'
          unzip -Z1 /tmp/ssh-drop-dispatcher-magisk-v4.13.0-verify-owner-rc4.zip | grep -Fxq 'webroot/app.js'
          unzip -Z1 /tmp/ssh-drop-dispatcher-magisk-v4.13.0-verify-owner-rc4.zip | grep -Fxq 'webroot/app.css'

      - name: Verify module metadata
        shell: bash
        run: |
          set -euo pipefail
          test -s source/magisk/module.prop
          grep -Eq '^id=[A-Za-z0-9._-]+$' source/magisk/module.prop
          grep -Eq '^version=.+$' source/magisk/module.prop
          grep -Eq '^versionCode=[0-9]+$' source/magisk/module.prop
          python3 -m json.tool update.json >/dev/null
          python3 -m json.tool update-rc.json >/dev/null

      - name: Verify tracked release archives
        shell: bash
        run: |
          set -euo pipefail
          command -v unzip >/dev/null
          found=0
          while IFS= read -r -d '' archive; do
            found=1
            unzip -tqq "$archive"
          done < <(find dist -maxdepth 1 -type f -name '*.zip' -print0)
          test "$found" -eq 1

      - name: Verify clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
