name: vnext-return-pr-integrate-v3

on:
  pull_request:

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'feature/return-channel-v1-phase1-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Apply bounded source and builder patches
        run: |
          python3 tools/vnext_return_pr_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/build_vnext_return.py')
          text=p.read_text()
          old='''    old_json = "printf ',\\\"verifyOwnership\\\":{\\\"dispatcher\\\":true,\\\"remoteShaRequired\\\":true,\\\"bashFallback\\\":\\\"fail_closed\\\",\\\"pythonDelivery\\\":\\\"unsupported\\\"},\\\"commands\\\":'"\n    new_json = "printf ',\\\"verifyOwnership\\\":{\\\"dispatcher\\\":true,\\\"remoteShaRequired\\\":true,\\\"bashFallback\\\":\\\"fail_closed\\\",\\\"pythonDelivery\\\":\\\"unsupported\\\"},\\\"returnChannel\\\":{\\\"bindingSchema\\\":1,\\\"requestSchema\\\":1,\\\"receiptSchema\\\":1,\\\"acceptanceSchema\\\":1,\\\"pullBased\\\":true,\\\"autoExecution\\\":false},\\\"commands\\\":'"'''
          new='''    old_json = '\"verifyOwnership\":{\"dispatcher\":true,\"remoteShaRequired\":true,\"bashFallback\":\"fail_closed\",\"pythonDelivery\":\"unsupported\"},\"commands\":'\n    new_json = '\"verifyOwnership\":{\"dispatcher\":true,\"remoteShaRequired\":true,\"bashFallback\":\"fail_closed\",\"pythonDelivery\":\"unsupported\"},\"returnChannel\":{\"bindingSchema\":1,\"requestSchema\":1,\"receiptSchema\":1,\"acceptanceSchema\":1,\"pullBased\":true,\"autoExecution\":false},\"commands\":' '''
          count=text.count(old)
          if count != 1: raise SystemExit(f'builder machine capability anchor count={count}')
          p.write_text(text.replace(old,new,1))
          PY
          gofmt -w source/vnext-return/sdd-return-helper.go source/vnext-return/sdd-return-helper_test.go
      - name: Run Return fixtures
        run: bash tests/verify_return_channel_v1.sh
      - name: Build candidate
        run: python3 tools/build_vnext_return.py --output /tmp/ssh-drop-dispatcher-magisk-v4.14.0-return-rc1.zip
      - name: Commit verified result and remove one-shot transports
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/vnext-return-pr-integrate.yml .github/workflows/vnext-return-pr-integrate-v2.yml .github/workflows/vnext-return-pr-integrate-v3.yml tools/vnext_return_pr_patch.py
          git add -A
          git commit -m 'feat(return): finalize Return Channel v1 candidate contracts'
          git push origin HEAD:"$HEAD_REF"
