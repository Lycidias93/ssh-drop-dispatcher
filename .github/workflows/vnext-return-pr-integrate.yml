name: vnext-return-pr-integrate

on:
  pull_request:

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'feature/return-channel-v1-phase1-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Close pre-PR replay and delivery-record gates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(); count=text.count(old)
              if count != 1: raise SystemExit(f'anchor mismatch {path}: {count}')
              p.write_text(text.replace(old,new,1))

          helper='source/vnext-return/sdd-return-helper.go'
          replace_once(helper,
          '''\tif err := validateBinding(bind, deliveryID, target); err != nil { return err }\n\tid, err := secureReturnID(); if err != nil { return err }''',
          '''\tif err := validateBinding(bind, deliveryID, target); err != nil { return err }\n\tdone, err := rt.deliveryTargetDone(deliveryID, target)\n\tif err != nil { return err }\n\tif !done { return fail("RETURN_DELIVERY_NOT_DONE", errors.New("matching successful target delivery record not found")) }\n\tid, err := secureReturnID(); if err != nil { return err }''')

          replace_once(helper,
          '''func validateBinding(bind binding, deliveryID, target string) error {\n\tif bind.Schema != bindingSchema || bind.DeliveryID != deliveryID || bind.Target != target || !bind.RemoteSHAVerified || bind.CompletedEpoch <= 0 || !shaRE.MatchString(bind.ArtifactSHA256) {\n\t\treturn fail("RETURN_BINDING_CONFLICT", errors.New("delivery binding does not match return request"))\n\t}\n\treturn nil\n}\n''',
          '''func validateBinding(bind binding, deliveryID, target string) error {\n\tif bind.Schema != bindingSchema || bind.DeliveryID != deliveryID || bind.Target != target || !bind.RemoteSHAVerified || bind.CompletedEpoch <= 0 || !shaRE.MatchString(bind.ArtifactSHA256) {\n\t\treturn fail("RETURN_BINDING_CONFLICT", errors.New("delivery binding does not match return request"))\n\t}\n\treturn nil\n}\n\nfunc (rt runtime) deliveryTargetDone(deliveryID, target string) (bool, error) {\n\tfile, err := os.Open(filepath.Join(rt.stateDir, "dispatch.done"))\n\tif err != nil {\n\t\tif os.IsNotExist(err) { return false, nil }\n\t\treturn false, err\n\t}\n\tdefer file.Close()\n\tsuffix := "|target=" + target\n\tscanner := bufio.NewScanner(file)\n\tfor scanner.Scan() {\n\t\tline := scanner.Text()\n\t\tif !strings.HasSuffix(line, suffix) { continue }\n\t\trecord := strings.TrimSuffix(line, suffix)\n\t\tsum := sha256.Sum256([]byte(record))\n\t\tif "SDD-"+hex.EncodeToString(sum[:])[:16] == deliveryID { return true, nil }\n\t}\n\treturn false, scanner.Err()\n}\n''')

          replace_once(helper,
          '''\tstate, err := rt.loadState(id)\n\tif err == nil && state.State == "verified" {\n\t\treturn rt.emit(map[string]any{"schema": stateSchema, "returnId": id, "state": "verified", "idempotent": true, "receiptSha256": state.ReceiptSHA256})\n\t}\n''',
          '''\tstate, err := rt.loadState(id)\n\tif err == nil && state.State == "verified" {\n\t\treq, cfg, target, contextErr := rt.loadRequestContext(id)\n\t\tif contextErr != nil { return contextErr }\n\t\tremoteReceipt := remoteJoin(cfg.RemoteOutbox, req.ReturnID, "receipt.json")\n\t\tif _, sizeErr := rt.remoteRegularSize(target, remoteReceipt, maxReceiptBytes); sizeErr != nil {\n\t\t\tvar ce *contractError\n\t\t\tif errors.As(sizeErr, &ce) && (ce.Transient || ce.Code == "RETURN_REMOTE_NOT_AVAILABLE") {\n\t\t\t\treturn rt.emit(map[string]any{"schema": stateSchema, "returnId": id, "state": "verified", "idempotent": true, "receiptSha256": state.ReceiptSHA256, "remoteReceiptRechecked": false})\n\t\t\t}\n\t\t\treturn sizeErr\n\t\t}\n\t\tremoteSHA, shaErr := rt.remoteSHA256(target, remoteReceipt)\n\t\tif shaErr != nil { return shaErr }\n\t\tif remoteSHA != state.ReceiptSHA256 { return fail("RETURN_REPLAY_CONFLICT", errors.New("remote receipt changed after local verification")) }\n\t\treturn rt.emit(map[string]any{"schema": stateSchema, "returnId": id, "state": "verified", "idempotent": true, "receiptSha256": state.ReceiptSHA256, "remoteReceiptRechecked": true})\n\t}\n''')

          replace_once(helper,
          '''\tremoteSize, err := rt.remoteRegularSize(target, remoteReceipt, maxReceiptBytes)\n\tif err != nil { return nil, err }\n\tif remoteSize < 1 { return nil, fail("RETURN_RECEIPT_SIZE_INVALID", errors.New("empty receipt")) }\n\tlocalReceipt := filepath.Join(stage, "receipt.json")''',
          '''\tremoteSize, err := rt.remoteRegularSize(target, remoteReceipt, maxReceiptBytes)\n\tif err != nil { return nil, err }\n\tif remoteSize < 1 { return nil, fail("RETURN_RECEIPT_SIZE_INVALID", errors.New("empty receipt")) }\n\tremoteReceiptSHA, err := rt.remoteSHA256(target, remoteReceipt)\n\tif err != nil { return nil, err }\n\tlocalReceipt := filepath.Join(stage, "receipt.json")''')

          replace_once(helper,
          '''\treceiptDigest, err := fileSHA256(localReceipt); if err != nil { return nil, err }\n\n\tverifiedTotal := int64(0)''',
          '''\treceiptDigest, err := fileSHA256(localReceipt); if err != nil { return nil, err }\n\tif receiptDigest != remoteReceiptSHA { return nil, fail("RETURN_RECEIPT_SHA_MISMATCH", errors.New("remote and local receipt sha differ")) }\n\n\tverifiedTotal := int64(0)''')

          test='tests/verify_return_channel_v1.sh'
          replace_once(test,
          '''python3 - "$return_id" <<'PY' <<<"$collect_json"\nimport json,sys\nrid=sys.argv[1]\nd=json.load(sys.stdin)''',
          '''COLLECT_JSON="$collect_json" python3 - "$return_id" <<'PY'\nimport json,os,sys\nrid=sys.argv[1]\nd=json.loads(os.environ["COLLECT_JSON"])''')
          replace_once(test,
          '''python3 - <<'PY' <<<"$idempotent_json"\nimport json,sys\nd=json.load(sys.stdin)''',
          '''IDEMPOTENT_JSON="$idempotent_json" python3 - <<'PY'\nimport json,os\nd=json.loads(os.environ["IDEMPOTENT_JSON"])''')
          replace_once(test,
          '''python3 - <<'PY' <<<"$state_json"\nimport json,sys\nd=json.load(sys.stdin)''',
          '''STATE_JSON="$state_json" python3 - <<'PY'\nimport json,os\nd=json.loads(os.environ["STATE_JSON"])''')
          PY
          gofmt -w source/vnext-return/sdd-return-helper.go source/vnext-return/sdd-return-helper_test.go
      - name: Run full Return fixtures
        run: bash tests/verify_return_channel_v1.sh
      - name: Build candidate
        run: python3 tools/build_vnext_return.py --output /tmp/ssh-drop-dispatcher-magisk-v4.14.0-return-rc1.zip
      - name: Commit verified integration and remove one-shot workflow
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/vnext-return-pr-integrate.yml
          git add -A
          git commit -m 'feat(return): close replay and delivery correlation gates'
          git push origin HEAD:"$HEAD_REF"
