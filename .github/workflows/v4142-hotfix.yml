name: v4.14.2-hotfix-candidate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Singleflight and source regression fixtures
        run: |
          set -euo pipefail
          sh -n source/magisk/service.sh
          sh -n source/stable-v4.14.1/service.sh
          sh -n source/vnext-issue69/service.sh
          sh -n source/vnext-issue69/tools/sdd-followup-coalesce.sh
          python3 -m unittest discover -s tests -p 'verify_followup_singleflight.py' -v
          python3 -m unittest discover -s tests -p 'verify_v4142_webui_static_bundle.py' -v
          python3 -m unittest discover -s tests -p 'verify_v4142_android_toybox_boolean.py' -v
      - name: Build deterministic hotfix candidate
        run: |
          set -euo pipefail
          mkdir -p /tmp/sdd-v4142-hotfix /tmp/sdd-v4142-verify
          zip=/tmp/sdd-v4142-hotfix/ssh-drop-dispatcher-magisk-v4.14.2.zip
          python3 tools/build_v4142_hotfix.py --output "$zip" | tee /tmp/v4142-hotfix.log
          grep -Fq 'RESULT: SDD_V4142_HOTFIX_BUILD_DONE outcome=success workflow_exit_code=0' /tmp/v4142-hotfix.log
          unzip -tq "$zip"
          # Extract completely before grep: with pipefail, grep -q can SIGPIPE unzip.
          unzip -p "$zip" module.prop > /tmp/sdd-v4142-verify/module.prop
          unzip -p "$zip" service.sh > /tmp/sdd-v4142-verify/service.sh
          unzip -p "$zip" bin/module-control-base > /tmp/sdd-v4142-verify/module-control-base
          sh -n /tmp/sdd-v4142-verify/module-control-base
          ! grep -Fq '\(true\|false\)' /tmp/sdd-v4142-verify/module-control-base
          grep -Fq '\(true\).*/\1/p; s/' /tmp/sdd-v4142-verify/module-control-base
          unzip -p "$zip" webroot/index.html > /tmp/sdd-v4142-verify/index.html
          unzip -p "$zip" webroot/app.js > /tmp/sdd-v4142-verify/app.js
          unzip -p "$zip" webroot/app.css > /tmp/sdd-v4142-verify/app.css
          ! grep -Eq '(href|src)="sdd-ui\\.(css|js)"' /tmp/sdd-v4142-verify/index.html
          grep -Fq 'SDD module controls (bundled for pinned Core static routes)' /tmp/sdd-v4142-verify/app.js
          grep -Fq 'SDD module styles (bundled for pinned Core static routes)' /tmp/sdd-v4142-verify/app.css
          node --check /tmp/sdd-v4142-verify/app.js
          unzip -Z1 "$zip" > /tmp/sdd-v4142-verify/entries.txt
          grep -Fxq 'version=4.14.2' /tmp/sdd-v4142-verify/module.prop
          grep -Fxq 'versionCode=4140200' /tmp/sdd-v4142-verify/module.prop
          grep -Fxq 'tools/sdd-followup-coalesce.sh' /tmp/sdd-v4142-verify/entries.txt
          grep -Fq 'scan_lock_old_but_owner_alive' /tmp/sdd-v4142-verify/service.sh
          grep -Fq 'bundle_ssh_atomic_refresh_failed' /tmp/sdd-v4142-verify/service.sh
          ! grep -Fq '( $SLEEP_BIN 5; /data/adb/modules/ssh_drop_dispatcher/service.sh' /tmp/sdd-v4142-verify/service.sh
          sha256sum "$zip" > /tmp/sdd-v4142-hotfix/SHA256SUMS
      - name: Confirm no private target material in candidate source
        run: |
          set -euo pipefail
          ! grep -RInE '192\\.168\\.178\\.|fd00::|BEGIN OPENSSH PRIVATE KEY|NTFY_TOKEN=' source/vnext-issue69
      - uses: actions/upload-artifact@v4
        with:
          name: sdd-v4.14.2-unpublished-hotfix-candidate
          path: /tmp/sdd-v4142-hotfix/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
